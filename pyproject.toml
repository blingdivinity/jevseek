[project]
name = "jevseek"
version = "0.1.0"
description = "DeepSeek proposes the next token, TypeSafe's Jev chooses it: a decision model used as a sampler"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "blingdivinity" }]
requires-python = ">=3.11"
keywords = ["jev", "typesafe", "deepseek", "sampling", "decoding", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevseek = "jevseek.cli:main"
jevseek-site = "jevseek.site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
